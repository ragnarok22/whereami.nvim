name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim

      - name: Install plenary.nvim
        env:
          PLENARY_COMMIT: b9fd5226c2f76c951fc8ed5923d85e4de065e509
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/plenary/start/plenary.nvim
          git -C ~/.local/share/nvim/site/pack/plenary/start/plenary.nvim init
          git -C ~/.local/share/nvim/site/pack/plenary/start/plenary.nvim remote add origin https://github.com/nvim-lua/plenary.nvim
          git -C ~/.local/share/nvim/site/pack/plenary/start/plenary.nvim fetch --depth 1 origin "$PLENARY_COMMIT"
          git -C ~/.local/share/nvim/site/pack/plenary/start/plenary.nvim checkout --detach FETCH_HEAD

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

      - name: Run Selene
        uses: NTBBloodbath/selene-action@v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: .

      - name: Run plenary tests
        run: nvim --headless -c "PlenaryBustedDirectory lua/tests {minimal_init = 'tests/minimal_init.lua'}" +qa

      - name: Check README links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md
